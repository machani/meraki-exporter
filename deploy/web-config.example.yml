# Example exporter-toolkit web configuration for meraki-exporter.
# Enable by setting WEB_CONFIG_FILE=/etc/meraki-exporter/web-config.yml
# (or --web.config.file). With no web config the exporter serves plain HTTP.
#
# Full reference:
# https://github.com/prometheus/exporter-toolkit/blob/master/docs/web-configuration.md

# --- TLS (uncomment to serve HTTPS) ---
#tls_server_config:
#  cert_file: /etc/meraki-exporter/tls.crt
#  key_file: /etc/meraki-exporter/tls.key

# --- Basic auth (uncomment to require credentials) ---
# Values are bcrypt hashes; generate one with:
#   htpasswd -nBC 12 "" | tr -d ':\n'
# (no htpasswd? any bcrypt generator with cost >= 10 works)
# NOTE: basic auth protects ALL endpoints including /healthz — health probes
# and the Prometheus scrape config both need the credentials.
#basic_auth_users:
#  prometheus: $2y$12$REPLACE_WITH_BCRYPT_HASH
