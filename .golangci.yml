# golangci-lint v2 configuration for meraki-exporter
# (adopted from smile-webhook-go; local-prefixes adapted to this module)
# Reference: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  # Go version is read from go.mod automatically in v2

linters:
  # Disable all linters and explicitly enable only what we want.
  default: none
  enable:
    # --- correctness ---
    - bodyclose        # checks HTTP response bodies are closed
    - copyloopvar      # detects loop variable captures (required pre-Go 1.22)
    - depguard         # bans packages listed in settings below
    - errcheck         # checks that errors are handled
    - errorlint        # finds errors wrapped incorrectly (fmt.Errorf %w, errors.Is/As)
    - gocheckcompilerdirectives # validates //go: compiler directives
    - gosec            # security checks (OWASP-aligned)
    - govet            # reports suspicious code constructs
    - ineffassign      # detects assignments to variables never used afterwards
    - noctx            # finds HTTP requests sent without a context
    - staticcheck      # comprehensive static analysis (SA*, S*, ST*, QF*)
    - unused           # checks for unused code
    # --- style / maintainability ---
    - dogsled          # checks assignments with too many blank identifiers
    - dupl             # detects code clones above a threshold
    - gochecknoinits   # discourages init() functions
    - gocritic         # opinionated style and diagnostics checks
    - gocyclo          # cyclomatic complexity
    - godox            # flags TODO/FIXME/HACK comments
    - intrange         # suggests for-range over integers (Go 1.22+)
    - lll              # line length limit
    - mnd              # detects magic numbers
    - nakedret         # flags naked returns in long functions
    - nolintlint       # enforces proper use of //nolint directives
    - revive           # opinionated drop-in replacement for golint
    - testifylint      # best practices for testify assertions
    - unconvert        # removes unnecessary type conversions
    - unparam          # detects unused function parameters

  settings:
    depguard:
      rules:
        banned-packages:
          deny:
            - pkg: "github.com/pkg/errors"
              desc: "Use the standard library errors package with fmt.Errorf(\"...: %w\", err) instead."
            - pkg: "github.com/instana/testify"
              desc: "Use github.com/stretchr/testify instead (instana/testify is a fork)."

    dupl:
      threshold: 120

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - dupImport   # handled by goimports formatter
        - ifElseChain
        - octalLiteral
        - whyNoLint   # nolintlint handles this

    gocyclo:
      min-complexity: 15

    godox:
      keywords:
        - FIXME
        - HACK

    govet:
      enable:
        - nilness
        - shadow

    errorlint:
      asserts: false

    lll:
      line-length: 140
      tab-width: 1

    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - '0'
        - '1'
        - '2'
        - '3'
      ignored-functions:
        - strings.SplitN
        - make
        - len

    nakedret:
      max-func-lines: 30

    nolintlint:
      allow-unused: false        # report unused nolint directives
      require-explanation: true  # require a reason comment
      require-specific: true     # require linter name(s) to be listed

    revive:
      rules:
        - name: indent-error-flow
        - name: unexported-return
          disabled: true
        - name: unused-parameter
        - name: unused-receiver
        - name: context-as-argument

    testifylint:
      enable-all: true

    unparam:
      check-exported: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    goimports:
      local-prefixes:
        - github.com/machani/meraki-exporter

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
