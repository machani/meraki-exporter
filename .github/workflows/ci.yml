name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  rules:
    runs-on: ubuntu-latest
    # Pin deliberately, and ideally to the Prometheus version that evaluates
    # these rules in your environment — the point is to test against the same
    # engine. Note promtool cannot be `go install`ed: the Prometheus go.mod
    # carries replace directives, so the released binary is used instead.
    env:
      PROMETHEUS_VERSION: "3.14.0"
    steps:
      - uses: actions/checkout@v5
      - name: install promtool
        run: |
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          sudo install -m 0755 promtool /usr/local/bin/promtool
          promtool --version
      # alerts_test.yml references alerts.yml by a relative path, so both
      # commands run from the directory holding them.
      - name: check and test alerting rules
        working-directory: prometheus
        run: |
          promtool check rules alerts.yml
          promtool test rules alerts_test.yml

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="0.0.0-${GITHUB_SHA::7}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o meraki-exporter ./cmd/meraki-exporter
