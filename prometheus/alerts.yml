# Prometheus alerting rules for meraki-exporter.
# Load via: rule_files: ['alerts.yml'] in prometheus.yml
#
# Timing assumptions: the staleness/duration thresholds below assume a 5m fast
# / 30m slow poll interval. Each rule notes the value to use for the shipped
# defaults (120s fast / 15m slow); revisit them if your intervals differ.
groups:
  - name: meraki-devices
    rules:
      - alert: MerakiDeviceOffline
        expr: meraki_device_status{status="offline"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Meraki device {{ $labels.name }} ({{ $labels.serial }}) is offline'
          description: 'Device in network {{ $labels.network_name }} has been offline for 10 minutes.'

      - alert: MerakiDeviceAlerting
        expr: meraki_device_status{status="alerting"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Meraki device {{ $labels.name }} ({{ $labels.serial }}) is in alerting state'
          description: 'Device in network {{ $labels.network_name }} is up but degraded (check Dashboard for the reason, e.g. port/PSU/gateway issue) for 30 minutes.'

  - name: meraki-wan
    rules:
      - alert: MerakiUplinkFailed
        expr: meraki_uplink_status{status="failed"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Meraki uplink {{ $labels.interface }} on {{ $labels.serial }} failed'
          description: 'Appliance uplink in network {{ $labels.network_name }} has been in failed state for 5 minutes.'

      - alert: MerakiUplinkHighLoss
        expr: min by (serial, network_id, network_name, interface) (meraki_uplink_loss_percent) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Uplink {{ $labels.interface }} on {{ $labels.serial }} has {{ $value | printf "%.1f" }}% packet loss to every monitored destination'
          description: 'Sustained packet loss above 5% for 15 minutes in network {{ $labels.network_name }}, across all probe destinations. Per-destination detail is on the WAN dashboard.'

      - alert: MerakiUplinkHighLatency
        expr: min by (serial, network_id, network_name, interface) (meraki_uplink_latency_seconds) > 0.3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Uplink {{ $labels.interface }} on {{ $labels.serial }} has {{ $value | humanizeDuration }} latency to every monitored destination'
          description: 'Sustained latency above 300ms for 15 minutes in network {{ $labels.network_name }}, across all probe destinations. Per-destination detail is on the WAN dashboard.'

      - alert: MerakiWarmSpareFailover
        # Fires when an HA-enabled PRIMARY has no active uplink — it is no
        # longer passing traffic, so the spare has taken over.
        #
        # Do NOT key this on the spare having an active uplink: a healthy warm
        # spare keeps its own uplinks active while in standby, so that fires
        # on every healthy pair.
        #
        # The ha_enabled guard used to be load-bearing: Meraki labels
        # standalone appliances role="primary" with enabled=false, which can be
        # a large share of an estate. The exporter now maps those to
        # role="standalone", so the guard is belt-and-braces — kept because it
        # also excludes anything reporting an unexpected role.
        expr: ((meraki_appliance_ha_role{role="primary"} == 1) and on(serial) (meraki_appliance_ha_enabled == 1)) unless on(serial) (max by (serial) (meraki_uplink_status{status="active"} == 1))
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'HA primary {{ $labels.serial }} has no active uplink (warm spare likely active)'
          description: 'Primary MX in network {{ $labels.network_name }} has had no active uplink for 5 minutes — the warm spare has most likely taken over. Requires the uplinks collector (HA state rides along at no extra API cost).'

      - alert: MerakiWarmSpareUnavailable
        # Loss of redundancy: the pair still serves traffic, but the spare
        # could not take over if the primary failed now. Two ways that shows
        # up, OR'd together so one incident raises one alert:
        #   1. the spare still reports but holds no usable uplink — nothing
        #      active or ready (a healthy standby normally has both);
        #   2. the spare device is offline, which can also drop it from the
        #      uplink-status response entirely and make (1) blind. That branch
        #      therefore takes the HA identity from max_over_time, so a spare
        #      that has vanished from the appliance API is still recognised
        #      as a spare for 6h. Needs the devices collector (default-on).
        # Both branches are aggregated to the same label set so the or
        # de-duplicates when a dead spare trips both at once.
        # Warning, not critical: nothing is down until the primary also fails.
        expr: |
          max by (serial, network_id, network_name) (
            ((meraki_appliance_ha_role{role="spare"} == 1) and on(serial) (meraki_appliance_ha_enabled == 1))
              unless on(serial) (max by (serial) (meraki_uplink_status{status=~"active|ready"} == 1))
          )
          or
          max by (serial, network_id, network_name) (
            (meraki_device_status{status="offline"} == 1)
              and on(serial) (max_over_time(meraki_appliance_ha_role{role="spare"}[6h]) == 1)
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Warm spare {{ $labels.serial }} cannot take over (redundancy lost)'
          description: 'Spare MX in network {{ $labels.network_name }} has had no usable uplink, or has been offline, for 10 minutes. Traffic is unaffected while the primary is healthy, but a primary failure now means an outage.'
  - name: meraki-vpn
    rules:
      - alert: MerakiVpnPeerUnreachable
        # meraki_vpn_peer_status is opt-in (COLLECTORS_ENABLED must include
        # vpn) — this rule only fires where the collector is enabled.
        expr: meraki_vpn_peer_status{status="unreachable"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Meraki VPN peer {{ $labels.peer_name }} unreachable from network {{ $labels.network_name }}'
          description: 'Site-to-site VPN peer ({{ $labels.peer_type }}) has been unreachable for 10 minutes.'

  - name: meraki-switch
    rules:
      - alert: MerakiSwitchPortDown
        # An infrastructure port has lost its link: still administratively
        # enabled, disconnected now, and connected for >90% of the preceding
        # week. meraki_switch_port_status is opt-in (COLLECTORS_ENABLED must
        # include switchports) — this rule only fires where it is enabled.
        #
        # The 90%-uptime test is what makes this pageable rather than a noise
        # generator: desk ports where laptops come and go never get near it,
        # so only permanently patched links (AP and camera uplinks, servers,
        # inter-switch links) can fire. Do NOT simplify it to "was connected
        # at some point recently" — that matches every unplugged laptop.
        #
        # The offset is load-bearing too: without it the port's current
        # downtime drags its own average below the threshold and the rule
        # silences itself the longer the fault lasts. Offsetting the window
        # asks "was this port reliably up BEFORE it went down". Side effect:
        # the alert self-resolves about 7 days into a sustained outage, once
        # the lookback window has moved entirely inside the downtime.
        #
        # The Device Health dashboard panel is deliberately broader (any port
        # connected within 7d) — a human scanning a list can filter noise that
        # an alert cannot.
        #
        # for: 15m is one poll cycle of confirmation, not fifteen minutes of
        # evidence. switchports sits in the slow group (30m on a 5m/30m
        # profile) and the exporter serves the same cached value between polls,
        # so the condition holds continuously from the first bad poll. 15m
        # keeps worst-case detection near 45min (up to 30m poll lag + 15m);
        # 30m bought a second poll cycle of nothing.
        expr: |
          meraki_switch_port_status{status="Disconnected"} == 1
            and on(serial, network_id, port_id) (meraki_switch_port_enabled == 1)
            and on(serial, network_id, port_id) (avg_over_time(meraki_switch_port_status{status="Connected"}[7d] offset 1h) > 0.9)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Switch port {{ $labels.port_id }} on {{ $labels.serial }} has lost its link'
          description: 'Port in network {{ $labels.network_name }} was connected for more than 90% of the past week but has been disconnected while still administratively enabled. Something that is normally always plugged in has gone away.'
  - name: meraki-wireless
    rules:
      - alert: MerakiChannelUtilizationHigh
        expr: meraki_wireless_channel_utilization_percent{kind="total"} > 80
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'AP {{ $labels.serial }} ({{ $labels.band }} GHz) at {{ $value | printf "%.0f" }}% channel utilization'
          description: 'Channel in network {{ $labels.network_name }} has been saturated (>80%) for 30 minutes; expect degraded client experience.'

      - alert: MerakiNonWifiInterference
        expr: meraki_wireless_channel_utilization_percent{kind="non_wifi"} > 40
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'AP {{ $labels.serial }} ({{ $labels.band }} GHz) sees {{ $value | printf "%.0f" }}% non-WiFi interference'
          description: 'Sustained non-802.11 interference in network {{ $labels.network_name }} — look for microwaves, cameras, Bluetooth or other RF sources near the AP.'

  - name: meraki-sensors
    rules:
      # No default thresholds for temperature/humidity/CO2/noise — those are
      # deployment-specific (a server room and a walk-in freezer want
      # opposite temperature bounds). Water, door, and battery are universal
      # enough to ship as defaults; add your own rules for the rest.
      - alert: MerakiSensorWaterDetected
        expr: meraki_sensor_water_detected == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Meraki sensor {{ $labels.serial }} detects water'
          description: 'Water detected in network {{ $labels.network_name }} for 2 minutes.'

      - alert: MerakiSensorDoorOpenTooLong
        expr: meraki_sensor_door_open == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Meraki sensor {{ $labels.serial }} door open for 30 minutes'
          description: 'Door monitored in network {{ $labels.network_name }} has been open for 30 minutes.'

      - alert: MerakiSensorBatteryLow
        expr: meraki_sensor_battery_percent < 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Meraki sensor {{ $labels.serial }} battery at {{ $value | printf "%.0f" }}%'
          description: 'Sensor in network {{ $labels.network_name }} has been below 10% battery for 30 minutes.'

  - name: meraki-licensing
    rules:
      - alert: MerakiLicenseExpiringSoon
        expr: (meraki_license_expiration_timestamp_seconds - time()) < 30 * 86400
        labels:
          severity: warning
        annotations:
          summary: 'Meraki license expires in {{ $value | humanizeDuration }}'
          description: 'Organization co-term license expires in less than 30 days. Renew to avoid loss of Dashboard functionality.'

      - alert: MerakiLicenseNotOK
        expr: meraki_license_status_ok == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'Meraki org license status is {{ $labels.status }}'
          description: 'Organization license status has not been OK for 1 hour.'

  - name: meraki-api
    rules:
      - alert: MerakiExporterRateLimited
        expr: increase(meraki_exporter_api_requests_total{code="429"}[30m]) > 10
        labels:
          severity: warning
        annotations:
          summary: 'Meraki exporter received {{ $value | printf "%.0f" }} rate-limit responses in 30m'
          description: 'The exporter is being throttled by the Meraki API. Other API consumers may be eating the per-org budget, or intervals are too aggressive — consider raising SCRAPE_INTERVAL / SLOW_SCRAPE_INTERVAL.'

      - alert: MerakiOrgAPIThrottled
        # meraki_org_api_response_codes is a 24h-window count across ALL API
        # consumers in the org (not just this exporter).
        expr: meraki_org_api_response_codes{code="429"} > 1000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'Org-wide Meraki API 429 count is {{ $value | printf "%.0f" }} over the last 24h'
          description: 'Some API consumer in the organization is being heavily rate limited. Check Dashboard > Organization > API usage to identify it.'

  - name: meraki-orgalerts
    rules:
      - alert: MerakiOrgCriticalAlertsOpen
        expr: sum(meraki_org_open_alerts{severity="critical"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Meraki Dashboard reports {{ $value | printf "%.0f" }} open critical-severity org alert(s)'
          description: 'Check Dashboard > Organization > Assurance > Alerts for details.'

  - name: meraki-exporter
    rules:
      - alert: MerakiExporterDown
        # Matches job names from scrape-config.example.yml (meraki, meraki-fast,
        # meraki-slow) — adjust the regex if your job names differ.
        expr: up{job=~"meraki.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Meraki exporter scrape target {{ $labels.job }} is down'
          description: 'Prometheus cannot scrape {{ $labels.instance }} for 5 minutes — exporter process or host is down. Poll-staleness alerts cannot fire in this state; this is the safety net.'

      - alert: MerakiExporterMetricsAbsent
        expr: absent(meraki_exporter_build_info)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'No meraki_exporter_build_info series present'
          description: 'The exporter has vanished from Prometheus entirely (scrape job removed or renamed?). Catches cases the up == 0 rule cannot.'

      - alert: MerakiCollectorFailing
        # The 15m window is shorter than the slow group's poll interval (15m
        # default, 30m on a 5m/30m profile), and the cached success value
        # persists between polls — so for a slow-group collector this fires
        # after a SINGLE failed poll, not after repeated ones. That is
        # deliberate: one failed slow poll already means half an hour of stale
        # data. Fast-group collectors do need several consecutive failures.
        expr: meraki_exporter_collector_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Meraki exporter collector {{ $labels.collector }} is failing'
          description: 'Collector last failed and its metrics are stale or absent. For slow-group collectors (clients, licenses, apiusage, alerts) one failed poll is enough to raise this. Note a collector reports failure for its whole dataset: the clients collector, for example, fails outright when the organization network list cannot be fetched. Check exporter logs (journalctl -u meraki-exporter).'

      - alert: MerakiClientsCollectorSlow
        # 1440s = 80% of a 30m SLOW_SCRAPE_INTERVAL (use 720 for
        # the 15m default). The clients collector makes one API call per network,
        # so raise this alongside the interval on orgs with many networks.
        expr: meraki_exporter_collector_duration_seconds{collector="clients"} > 1440
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Clients collector takes {{ $value | humanizeDuration }} per poll'
          description: 'The clients collector is close to exceeding the slow poll interval; polls will start aborting. Raise SLOW_SCRAPE_INTERVAL or trim COLLECTORS_ENABLED.'

      - alert: MerakiExporterFastGroupStale
        # 3x a 5m fast interval; use 600 for the 2m default.
        expr: time() - meraki_exporter_last_poll_timestamp_seconds{group="fast"} > 900
        labels:
          severity: critical
        annotations:
          summary: 'Meraki exporter fast poll group has not completed in over 15 minutes'
          description: 'Device/uplink/wireless metrics are stale. Check exporter logs and Meraki API reachability.'

      - alert: MerakiExporterSlowGroupStale
        # 3x a 30m slow interval; use 3600 for the 15m default.
        expr: time() - meraki_exporter_last_poll_timestamp_seconds{group="slow"} > 5400
        labels:
          severity: warning
        annotations:
          summary: 'Meraki exporter slow poll group has not completed in over 90 minutes'
          description: 'Client/license/API-usage metrics are stale. Check exporter logs; see also MerakiClientsCollectorSlow.'
